<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rashell — raven themes</title>
<style>
:root{
  --page-bg:#0a0b0f;
  --page-fg:#e6e8ef;
  --page-dim:#7d849b;
  --page-line:rgba(255,255,255,.09);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page-bg);
  color:var(--page-fg);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
svg.sprite{display:none}

/* ---------- page chrome ---------- */
.pagehead{
  padding:34px 40px 0;
  max-width:1560px;margin:0 auto;
}
.pagehead h1{
  font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  margin:0 0 6px;color:var(--page-dim);
}
.pagehead p{margin:0;font-size:19px;color:var(--page-fg);max-width:70ch;line-height:1.5}
.tabs{
  display:flex;gap:8px;flex-wrap:wrap;
  padding:26px 40px 0;max-width:1560px;margin:0 auto;
  position:sticky;top:0;z-index:60;background:linear-gradient(var(--page-bg) 72%,transparent);
  padding-bottom:18px;
}
.tab{
  appearance:none;border:1px solid var(--page-line);background:transparent;color:var(--page-dim);
  font:inherit;font-size:15px;padding:11px 18px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;gap:10px;transition:.16s;
}
.tab:hover{color:var(--page-fg);border-color:rgba(255,255,255,.2)}
.tab[aria-selected="true"]{background:var(--page-fg);color:#0a0b0f;border-color:var(--page-fg);font-weight:600}
.tab .swatch{width:12px;height:12px;border-radius:3px}
.tab:focus-visible,.mod:focus-visible,.row:focus-visible,.tile:focus-visible{outline:2px solid #7aa2ff;outline-offset:3px}

.concept{display:none;max-width:1560px;margin:0 auto;padding:8px 40px 90px}
.concept.is-on{display:block}
.concept-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:0 0 4px}
.concept-head h2{font-size:34px;margin:0;letter-spacing:-.02em}
.concept-head .idx{font:600 13px/1 var(--mono);color:var(--page-dim);letter-spacing:.1em}
.concept-note{color:var(--page-dim);font-size:18px;line-height:1.55;max-width:78ch;margin:8px 0 22px}
.section-label{
  font:600 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--page-dim);
  margin:44px 0 14px;display:flex;align-items:center;gap:12px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--page-line)}

/* ---------- the screen mock ---------- */
.screen{
  position:relative;border-radius:14px;overflow:hidden;
  background:var(--wall);
  padding:var(--screen-pad,0);
  min-height:560px;
  font-family:var(--font);
  color:var(--fg);
  isolation:isolate;
}
.wall-art{position:absolute;inset:0;z-index:0;background:var(--wall-art);opacity:var(--wall-art-o,1)}
.fakewin{
  position:absolute;left:8%;right:8%;top:calc(var(--bar-h) + 74px);bottom:34px;z-index:1;
  border-radius:var(--win-radius,10px);background:var(--win-bg);border:1px solid var(--win-line);
  box-shadow:0 40px 90px rgba(0,0,0,.45);overflow:hidden;
}
.fakewin .fw-bar{height:44px;border-bottom:1px solid var(--win-line);display:flex;align-items:center;gap:10px;padding:0 18px;font-size:14px;color:var(--dim)}
.fakewin .fw-dot{width:11px;height:11px;border-radius:50%;background:var(--win-line)}
.fakewin .fw-body{padding:26px 22px;display:grid;gap:12px}
.fakewin .fw-line{height:11px;border-radius:4px;background:var(--win-line)}

/* ---------- bar ---------- */
.bar{
  position:relative;z-index:20;height:var(--bar-h);
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--bar-bg);
  backdrop-filter:var(--bar-blur,none);-webkit-backdrop-filter:var(--bar-blur,none);
  border:var(--bar-border,0);
  border-radius:var(--bar-radius,0);
  margin:var(--bar-margin,0);
  padding:var(--bar-pad,0 16px);
  box-shadow:var(--bar-shadow,none);
}
.grp{display:flex;align-items:center;gap:var(--grp-gap,8px);height:100%}
.grp-center{position:absolute;left:50%;transform:translateX(-50%)}
.mod{
  appearance:none;border:var(--mod-border,0);background:var(--mod-bg,transparent);color:var(--fg);
  font:inherit;font-size:var(--mod-fs,17px);font-weight:var(--mod-fw,500);
  letter-spacing:var(--mod-ls,0);text-transform:var(--mod-tt,none);
  height:var(--mod-h,42px);padding:var(--mod-pad,0 14px);border-radius:var(--mod-radius,999px);
  display:flex;align-items:center;gap:9px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;
  white-space:nowrap;
}
.mod:hover{background:var(--mod-bg-h,rgba(255,255,255,.09))}
.mod.is-open{background:var(--mod-bg-a,rgba(255,255,255,.14));color:var(--fg-hi,var(--fg))}
.mod .ic{width:var(--ic,21px);height:var(--ic,21px);flex:none}
.mod .num{font-family:var(--num-font,inherit);font-variant-numeric:tabular-nums;font-size:var(--num-fs,17px)}
.mod .lbl{font-size:var(--lbl-fs,11px);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.clockmod{flex-direction:column;gap:1px;line-height:1.12;align-items:center;padding:0 18px}
.clockmod .time{font-family:var(--num-font,inherit);font-variant-numeric:tabular-nums;font-size:var(--clock-fs,19px);font-weight:600;letter-spacing:var(--clock-ls,0)}
.clockmod .date{font-size:12px;color:var(--dim);letter-spacing:.08em}

/* workspaces */
.ws{display:flex;align-items:center;gap:var(--ws-gap,7px);padding:var(--ws-pad,0)}
.wsdot{
  height:var(--ws-h,34px);min-width:var(--ws-h,34px);padding:0 var(--ws-px,0);
  border-radius:var(--ws-radius,999px);border:var(--ws-border,0);
  background:var(--ws-bg,rgba(255,255,255,.06));color:var(--dim);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font:inherit;font-size:14px;font-weight:600;transition:.2s;
}
.wsdot.filled{background:var(--ws-bg-f,rgba(255,255,255,.13));color:var(--fg)}
.wsdot.active{
  min-width:var(--ws-active-w,58px);background:var(--ws-bg-a);color:var(--ws-fg-a,#fff);
  box-shadow:var(--ws-glow,none);
}

/* ---------- popovers ---------- */
.pop-layer{position:absolute;inset:0;z-index:40;pointer-events:none}
.pop{
  position:absolute;pointer-events:auto;
  animation:popin .17s cubic-bezier(.2,.9,.3,1);
  transform-origin:top center;
}
@keyframes popin{from{opacity:0;transform:translateY(-8px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}

.panel{
  width:var(--panel-w,420px);
  background:var(--panel-bg);
  backdrop-filter:var(--panel-blur,none);-webkit-backdrop-filter:var(--panel-blur,none);
  border:var(--panel-border,0);
  border-radius:var(--panel-radius,18px);
  box-shadow:var(--panel-shadow,0 26px 60px rgba(0,0,0,.5));
  overflow:hidden;font-family:var(--font);color:var(--fg);
}
.panel-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:var(--phead-pad,18px 20px 12px);
  border-bottom:var(--phead-border,0);background:var(--phead-bg,transparent);
}
.panel-title{font-size:var(--ptitle-fs,13px);font-weight:700;letter-spacing:var(--ptitle-ls,.14em);text-transform:var(--ptitle-tt,uppercase);color:var(--fg-hi,var(--fg))}
.panel-sub{font-size:13px;color:var(--dim)}
.panel-body{padding:var(--pbody-pad,14px 20px 20px);display:grid;gap:16px}
.grouplabel{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:-6px}

/* slider */
.slider-row{display:flex;align-items:center;gap:14px}
.slider-row .ic{width:22px;height:22px;color:var(--dim);flex:none}
.slider{flex:1;height:26px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.track{position:relative;width:100%;height:var(--track-h,8px);border-radius:var(--track-radius,999px);background:var(--track-bg,rgba(255,255,255,.12));overflow:visible}
.fill{position:absolute;inset:0;width:var(--v,60%);border-radius:inherit;background:var(--track-fill)}
.knob{
  position:absolute;top:50%;left:var(--v,60%);width:var(--knob,16px);height:var(--knob,16px);
  transform:translate(-50%,-50%);border-radius:var(--knob-radius,50%);background:var(--knob-bg,#fff);
  box-shadow:var(--knob-shadow,0 2px 8px rgba(0,0,0,.5));display:var(--knob-d,block);
}
.slider-row .val{font-family:var(--num-font,var(--mono));font-variant-numeric:tabular-nums;font-size:15px;color:var(--dim);min-width:44px;text-align:right}

/* rows */
.rows{display:grid;gap:var(--rows-gap,4px)}
.row{
  appearance:none;border:var(--row-border,0);background:var(--row-bg,transparent);color:var(--fg);font:inherit;
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:var(--row-pad,11px 12px);border-radius:var(--row-radius,12px);cursor:pointer;font-size:15px;transition:.14s;
}
.row:hover{background:var(--row-bg-h,rgba(255,255,255,.07))}
.row.on{background:var(--row-bg-a,rgba(255,255,255,.1));color:var(--fg-hi,var(--fg))}
.row .ic{width:19px;height:19px;color:var(--dim);flex:none}
.row.on .ic{color:var(--accent)}
.row-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-tag{font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.row.on .row-tag{color:var(--accent)}
.mini{width:104px;flex:none}
.mini .track{height:var(--mini-h,6px)}
.mini .knob{display:none}

/* stat tiles */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--stats-gap,10px)}
.stat{
  background:var(--tile-bg,rgba(255,255,255,.05));border:var(--tile-border,0);
  border-radius:var(--tile-radius,14px);padding:var(--tile-pad,13px 14px);display:grid;gap:8px;
}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stat-name{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.stat-val{font-family:var(--num-font,var(--mono));font-variant-numeric:tabular-nums;font-size:24px;font-weight:600;letter-spacing:-.01em;color:var(--fg-hi,var(--fg))}
.stat-val small{font-size:13px;font-weight:500;color:var(--dim);margin-left:4px}
.meter{height:var(--meter-h,6px);border-radius:var(--meter-radius,999px);background:var(--track-bg,rgba(255,255,255,.12));overflow:hidden}
.meter i{display:block;height:100%;width:40%;border-radius:inherit;background:var(--m,var(--accent));transition:width .5s ease}
.spark{width:100%;height:34px;display:block;overflow:visible}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.spark .area{fill:var(--spark-fill,rgba(255,255,255,.07));stroke:none}

/* process table */
.proc{display:grid;gap:var(--rows-gap,4px)}
.proc-head,.proc-row{display:grid;grid-template-columns:1fr 62px 74px 30px;align-items:center;gap:10px;font-size:15px}
.proc-head{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:0 12px 4px}
.proc-row{padding:var(--row-pad,10px 12px);border-radius:var(--row-radius,12px);background:var(--row-bg,transparent);border:var(--row-border,0)}
.proc-row:hover{background:var(--row-bg-h,rgba(255,255,255,.07))}
.proc-row b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proc-row .n{font-family:var(--num-font,var(--mono));font-variant-numeric:tabular-nums;color:var(--dim);text-align:right}
.proc-row .n.hot{color:var(--accent)}
.kill{appearance:none;border:0;background:transparent;color:var(--dim);cursor:pointer;padding:4px;border-radius:6px;display:flex;opacity:0;transition:.14s}
.proc-row:hover .kill{opacity:1}
.kill:hover{color:var(--danger,#ff7a90)}
.kill .ic{width:15px;height:15px;stroke-width:2}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--cal-gap,3px)}
.cal span{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;
  font-family:var(--num-font,inherit);font-variant-numeric:tabular-nums;border-radius:var(--cal-radius,9px);color:var(--fg);
}
.cal .dow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);aspect-ratio:auto;padding:2px 0 6px}
.cal .out{color:var(--dim);opacity:.35}
.cal .now{background:var(--accent);color:var(--on-accent,#0a0b0f);font-weight:700}
.bigtime{font-family:var(--num-font,inherit);font-variant-numeric:tabular-nums;font-size:52px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--fg-hi,var(--fg))}
.bigdate{font-size:15px;color:var(--dim);margin-top:6px}

/* notifications */
.note{
  display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
  padding:var(--note-pad,13px 14px);border-radius:var(--row-radius,12px);
  background:var(--tile-bg,rgba(255,255,255,.05));border:var(--tile-border,0);
}
.note-app{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
.note-t{font-size:15px;font-weight:600;margin:3px 0 3px;color:var(--fg-hi,var(--fg))}
.note-b{font-size:14px;color:var(--dim);line-height:1.45}
.note-time{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.avatar{width:34px;height:34px;border-radius:var(--avatar-radius,10px);background:var(--avatar-bg,linear-gradient(140deg,#5b6bff,#2ee6c4));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#08090d}

/* media */
.media{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.art{width:86px;height:86px;border-radius:var(--art-radius,14px);background:var(--art-bg);flex:none;position:relative;overflow:hidden}
.art::after{content:"";position:absolute;inset:0;background:var(--art-tex,none)}
.mtitle{font-size:18px;font-weight:600;color:var(--fg-hi,var(--fg));margin-bottom:3px}
.martist{font-size:14px;color:var(--dim)}
.mctrl{display:flex;align-items:center;gap:6px;margin-top:12px}
.mbtn{appearance:none;border:var(--mod-border,0);background:var(--mod-bg,rgba(255,255,255,.06));color:var(--fg);border-radius:var(--mbtn-radius,999px);width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.14s}
.mbtn:hover{background:var(--mod-bg-h,rgba(255,255,255,.12))}
.mbtn.play{width:46px;height:46px;background:var(--accent);color:var(--on-accent,#0a0b0f)}
.mbtn .ic{width:17px;height:17px}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:8px}

/* switches, tiles, chips */
.switch{width:44px;height:25px;border-radius:999px;background:var(--track-bg,rgba(255,255,255,.14));position:relative;cursor:pointer;flex:none;transition:.18s;border:var(--row-border,0)}
.switch i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--knob-bg,#fff);transition:.18s}
.switch.on{background:var(--accent)}
.switch.on i{left:22px;background:var(--on-accent,#0a0b0f)}
.tilegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--stats-gap,10px)}
.tile{
  appearance:none;border:var(--tile-border,0);background:var(--tile-bg,rgba(255,255,255,.05));color:var(--fg);
  border-radius:var(--tile-radius,14px);padding:16px 6px 12px;display:grid;gap:9px;justify-items:center;cursor:pointer;font:inherit;transition:.14s;
}
.tile:hover{background:var(--row-bg-h,rgba(255,255,255,.1));color:var(--fg-hi,var(--fg))}
.tile .ic{width:23px;height:23px}
.tile span{font-size:12px;color:var(--dim);letter-spacing:.04em}
.tile.danger:hover{color:var(--danger,#ff7a90)}
.tile.danger:hover .ic{color:var(--danger,#ff7a90)}
.chips{display:flex;gap:8px}
.chip{
  flex:1;appearance:none;font:inherit;font-size:14px;cursor:pointer;padding:10px 8px;border-radius:var(--row-radius,12px);
  background:var(--tile-bg,rgba(255,255,255,.05));border:var(--tile-border,0);color:var(--dim);transition:.14s;
}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--accent);color:var(--on-accent,#0a0b0f);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:2px;height:15px}
.bars i{width:3px;background:var(--dim);border-radius:1px}
.bars i.lit{background:var(--accent)}
.bars i:nth-child(1){height:30%}.bars i:nth-child(2){height:55%}.bars i:nth-child(3){height:78%}.bars i:nth-child(4){height:100%}

.linkbtn{appearance:none;border:0;background:transparent;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:0}
.hint{font-size:15px;color:var(--page-dim);margin:14px 0 0;display:flex;align-items:center;gap:9px}
.hint kbd{font:600 12px/1 var(--mono);border:1px solid var(--page-line);border-radius:6px;padding:5px 7px;color:var(--page-fg)}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:26px;align-items:start}
.gcard{display:grid;gap:10px}
.gcard > .caption{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--page-dim)}
.gwrap{background:var(--wall);border-radius:14px;padding:22px;font-family:var(--font);color:var(--fg)}
.gwrap .panel{width:100%}

/* ---------- rashell wordmark ---------- */
.brandmod{gap:10px}
.brand{font-size:15px;font-weight:600;letter-spacing:.01em;color:var(--fg-hi,var(--fg))}

/* ================= 1. OIL SLICK ================= */
[data-design="oilslick"]{
  --font:var(--sans);--num-font:var(--sans);
  --wall:#050507;
  --wall-art:radial-gradient(900px 500px at 18% -14%,rgba(122,80,255,.24),transparent 60%),radial-gradient(780px 460px at 80% -6%,rgba(30,220,190,.16),transparent 58%),radial-gradient(640px 420px at 52% 46%,rgba(255,70,185,.07),transparent 62%),repeating-linear-gradient(112deg,rgba(255,255,255,.015) 0 2px,transparent 2px 8px),#050507;
  --fg:#b7bbc9;--fg-hi:#f4f6fc;--dim:#646a7e;--accent:#8a6dff;--on-accent:#07070a;--danger:#ff5f7e;
  --bar-h:60px;--bar-bg:rgba(8,8,11,.82);--bar-blur:blur(20px) saturate(1.35);
  --bar-radius:0;--bar-margin:0;--bar-pad:0 10px;--bar-border:0;--bar-shadow:0 12px 36px rgba(0,0,0,.62);
  --mod-h:40px;--mod-fs:16px;--mod-bg-h:rgba(255,255,255,.06);--mod-bg-a:rgba(255,255,255,.1);
  --ws-h:34px;--ws-bg:rgba(255,255,255,.045);--ws-bg-f:rgba(255,255,255,.1);
  --ws-bg-a:linear-gradient(100deg,#ff5cc8,#8a6dff 42%,#2fd6b0);--ws-fg-a:#07070a;
  --ws-glow:0 0 26px rgba(138,109,255,.5);--ws-active-w:56px;
  --track-bg:rgba(255,255,255,.1);--track-fill:linear-gradient(90deg,#ff5cc8,#8a6dff 45%,#2fd6b0);
  --panel-bg:rgba(9,9,13,.88);--panel-blur:blur(26px) saturate(1.4);
  --panel-border:1px solid rgba(255,255,255,.09);--panel-radius:18px;
  --panel-shadow:0 30px 66px rgba(0,0,0,.66);
  --tile-bg:rgba(255,255,255,.04);--tile-radius:13px;
  --win-bg:rgba(9,9,13,.86);--win-line:rgba(255,255,255,.07);
  --art-bg:linear-gradient(140deg,#ff5cc8,#8a6dff 45%,#2fd6b0);
  --avatar-bg:linear-gradient(140deg,#ff5cc8,#8a6dff 45%,#2fd6b0);
  --spark-fill:rgba(138,109,255,.13);
}
[data-design="oilslick"] .bar::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;opacity:.8;
  background:linear-gradient(90deg,#ff5cc8,#8a6dff 34%,#2fd6b0 68%,#ff5cc8);
  background-size:200% 100%;animation:slick 16s linear infinite;
}
@keyframes slick{to{background-position:200% 0}}
[data-design="oilslick"] .mod{position:relative;overflow:hidden}
[data-design="oilslick"] .mod::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;

const ic = (n, cls) => `<svg class="ic ${cls||''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

  {id:'oilslick', name:'Oil Slick', sw:'linear-gradient(120deg,#ff5cc8,#8a6dff 45%,#2fd6b0)',
   note:'A raven only looks black until light hits it. The bar is near-black with no colour at rest — the magenta / violet / teal sheen lives on the active workspace, on a 2px seam under the bar, and sweeps across any module you hover. Colour means something is happening; stillness is black.'},
  {id:'muninn', name:'Muninn', sw:'linear-gradient(120deg,#c9a227,#6ea8d8)',
   note:'Named for the raven of memory, who flew out each day and came back with what he saw. Engraved and austere: hairline rules, a serif clock, ink and old gold. The rule that makes it work — gold is for what you control, cold blue is for what the machine reports. You never mistake a reading for a switch.'},
  {id:'nevermore', name:'Nevermore', sw:'linear-gradient(120deg,#a11d33,#e6ded0)',
   note:'The gothic reading of the name. Bone-parchment text on ink, a serif that carries the clock and every panel title, oxblood as the only accent and not a gradient in sight. Panel headers sit under a double rule like a printed page, and a vignette darkens the screen corners so the bar lifts off it.'},
  {id:'talon', name:'Talon', sw:'linear-gradient(120deg,#f2f0ea,#5d6064)',
   note:'Beak and claw. Every surface has a corner cut away at 45°, so modules and panels read as chipped rather than rounded, and an open module inverts to a solid bone slab. Strictly bone on black — red appears in exactly two places, kill and shut down, and means the same thing in both.'}
];

const PANEL_ORDER = ['sound','system','clock','notifications','media','network','battery','power','keyboard','apps'];
const PANEL_LABEL = {sound:'Sound',system:'System monitor',clock:'Clock & calendar',notifications:'Notifications',media:'Media',network:'Network',battery:'Battery & brightness',power:'Session',keyboard:'Keyboard layout',apps:'Launcher'};

/* ---------------- bar ---------------- */
function barHTML(id){
  const ws = [1,2,3,4,5,6].map(n=>{
    const cls = n===1?'wsdot active':([2,4,6].includes(n)?'wsdot filled':'wsdot');
    return `<button class="${cls}">${n}</button>`;
  }).join('');
  const lbl = t => id==='blade' ? `<span class="lbl">${t}</span>` : '';
  return `
<div class="bar">
  <div class="grp grp-left">
    <button class="mod brandmod" data-panel="apps">${ic('raven')}<span class="brand">rashell</span></button>
    <div class="ws">${ws}</div>
    <button class="mod" data-panel="media">${ic('note')}<span>Dayvan Cowboy</span></button>
  </div>
  <div class="grp grp-center">
    <button class="mod clockmod" data-panel="clock"><span class="time" data-live="time">15:59</span><span class="date">Mon, Aug 24</span></button>
  </div>
  <div class="grp grp-right">
    <button class="mod" data-panel="keyboard">${lbl('kb')}<span class="num">US</span></button>
    <button class="mod" data-panel="system">${ic('cpu')}${lbl('cpu')}<span class="num" data-live="cpubar">14%</span></button>
    <button class="mod" data-panel="system">${ic('ram')}${lbl('ram')}<span class="num">6.4G</span></button>
    <button class="mod" data-panel="sound">${ic('vol')}${lbl('vol')}<span class="num">62</span></button>
    <button class="mod" data-panel="network">${ic('wifi')}${lbl('net')}</button>
    <button class="mod" data-panel="battery">${ic('bat')}${lbl('bat')}<span class="num">95%</span></button>
    <button class="mod" data-panel="notifications">${ic('bell')}</button>
    <button class="mod" data-panel="power">${ic('power')}</button>
  </div>
</div>`;
}

/* ---------------- build ---------------- */
const tabs = document.getElementById('tabs');
const main = document.getElementById('main');
DESIGNS.forEach((d,i)=>{
  tabs.insertAdjacentHTML('beforeend',
    `<button class="tab" role="tab" data-go="${d.id}" aria-selected="${i===0}"><span class="swatch" style="background:${d.sw}"></span>${d.name}</button>`);
  main.insertAdjacentHTML('beforeend', `
    <section class="concept ${i===0?'is-on':''}" data-concept="${d.id}">
      <div class="concept-head"><span class="idx">0${i+1}</span><h2>${d.name}</h2></div>
      <p class="concept-note">${d.note}</p>
      ${screenHTML(d)}
      <p class="hint">Click any module in the bar above. <kbd>Esc</kbd> closes.</p>
      <div class="section-label">Every panel, full size</div>
      ${galleryHTML(d)}
    </section>`);
});

tabs.addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected', x===t));
  document.querySelectorAll('.concept').forEach(c=>c.classList.toggle('is-on', c.dataset.concept===t.dataset.go));
  window.scrollTo({top:0,behavior:'instant'});
});

/* ---------------- popovers ---------------- */
function closeAll(){
  document.querySelectorAll('.pop-layer').forEach(l=>l.innerHTML='');
  document.querySelectorAll('.mod.is-open').forEach(m=>m.classList.remove('is-open'));
}
document.addEventListener('click', e=>{
  const mod = e.target.closest('.mod');
  if(!mod){ if(!e.target.closest('.pop')) closeAll(); return; }
  const screen = mod.closest('.screen');
  const key = mod.dataset.panel;
  const wasOpen = mod.classList.contains('is-open');
  closeAll();
  if(wasOpen) return;
  mod.classList.add('is-open');
  const layer = screen.querySelector('.pop-layer');
  const pop = document.createElement('div');
  pop.className = 'pop';
  pop.innerHTML = P[key]();
  layer.appendChild(pop);
  const sr = screen.getBoundingClientRect(), mr = mod.getBoundingClientRect();
  const w = pop.firstElementChild.offsetWidth;
  let left = mr.left - sr.left + mr.width/2 - w/2;
  left = Math.max(14, Math.min(left, sr.width - w - 14));
  pop.style.left = left + 'px';
  pop.style.top = (mr.bottom - sr.top + (screen.dataset.design==='nevermore'?10:8)) + 'px';
  buildCal(pop);
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAll(); });

/* ---------------- sliders ---------------- */
let drag = null;
function setSlider(sl, clientX){
  const r = sl.getBoundingClientRect();
  const v = Math.round(Math.max(0, Math.min(1, (clientX - r.left)/r.width))*100);
  sl.querySelector('.track').style.setProperty('--v', v+'%');
  const val = sl.parentElement.querySelector('.val');
  if(val) val.textContent = v+'%';
}
document.addEventListener('pointerdown', e=>{
  const sl = e.target.closest('.slider'); if(!sl) return;
  e.preventDefault(); drag = sl; setSlider(sl, e.clientX);
});
document.addEventListener('pointermove', e=>{ if(drag) setSlider(drag, e.clientX); });
document.addEventListener('pointerup', ()=>{ drag = null; });

/* switches + chips + kill */
document.addEventListener('click', e=>{
  const sw = e.target.closest('.switch'); if(sw) sw.classList.toggle('on');
  const chip = e.target.closest('.chip');
  if(chip){ chip.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); chip.classList.add('on'); }
  const row = e.target.closest('.row');
  if(row && row.querySelector('.row-tag') && !e.target.closest('.switch') && !e.target.closest('.slider')){
    const set = row.parentElement.querySelectorAll('.row');
    if([...set].some(r=>r.classList.contains('on'))){ set.forEach(r=>r.classList.remove('on')); row.classList.add('on'); }
  }
  const k = e.target.closest('.kill');
  if(k){ e.stopPropagation(); const r = k.closest('.proc-row'); r.style.transition='.2s'; r.style.opacity='0'; setTimeout(()=>r.remove(),200); }
});

/* ---------------- calendar ---------------- */
function buildCal(scope){
  scope.querySelectorAll('[data-cal]').forEach(el=>{
    if(el.dataset.built) return; el.dataset.built = 1;
    let h = ['Mo','Tu','We','Th','Fr','Sa','Su'].map(d=>`<span class="dow">${d}</span>`).join('');
    for(let i=0;i<5;i++) h += `<span class="out">${27+i}</span>`;      // Jul 27–31
    for(let d=1;d<=31;d++) h += `<span class="${d===24?'now':''}">${d}</span>`;
    for(let d=1;d<=6;d++) h += `<span class="out">${d}</span>`;        // Sep 1–6
    el.innerHTML = h;
  });
}
buildCal(document);

/* ---------------- live bits ---------------- */
let hist = Array.from({length:26},()=>10+Math.random()*14);
function tick(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0'), mm = String(now.getMinutes()).padStart(2,'0');
  document.querySelectorAll('[data-live="time"]').forEach(e=>e.textContent = `${hh}:${mm}`);
  document.querySelectorAll('[data-live="bigtime"]').forEach(e=>e.textContent = `${hh}:${mm}`);

  hist.shift(); hist.push(Math.max(3, Math.min(96, hist[hist.length-1] + (Math.random()-.48)*22)));
  const cpu = Math.round(hist[hist.length-1]);
  document.querySelectorAll('[data-live="cpu"]').forEach(e=>e.innerHTML = `${cpu}<small>%</small>`);
  document.querySelectorAll('[data-live="cpubar"]').forEach(e=>e.textContent = cpu+'%');
  const pts = hist.map((v,i)=>`${(i/(hist.length-1)*100).toFixed(1)},${(30 - v/100*28).toFixed(1)}`).join(' ');
  document.querySelectorAll('[data-live="spark"]').forEach(s=>{
    s.querySelector('polyline').setAttribute('points', pts);
    s.querySelector('polygon').setAttribute('points', `0,30 ${pts} 100,30`);
  });
}
tick(); setInterval(tick, 1600);
</script>
